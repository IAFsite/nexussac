            <div class="header-title">

                <p>

        <a

<a href="version.html" id="nexus-version">

<!-- =========================
     VERSION
========================= -->

<script>

    fetch("version.json")
        .then(response => {

            if (!response.ok) {
                throw new Error("Failed to load version data");
            }

            return response.json();

        })

        .then(data => {

            const versionElement =
                document.getElementById("nexus-version");

            if (versionElement && data.current_version) {

                versionElement.textContent =
                    `NEXSAC v${data.current_version}`;

            }

        })

        .catch(error => {

            console.error("Version data error:", error);

        });

</script>


</body>
