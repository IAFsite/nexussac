<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1">

    <title>Informasi Penelitian | Sekolah Alam Cikeas</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="css/paper.css">

    <link
        rel="icon"
        type="image/png"
        href="icon-192.png">
    <script
        src="jsdata/paper.js"
        defer>
    </script>

    <script
        src="js/paper.js"
        defer>
    </script>

</head>


<body>


<header>

    <div class="header-container">

        <div class="header-brand">

            <img
                src="https://sekolahalamcikeas.sch.id/wp-content/uploads/2022/09/logo-sac-small.png"
                class="logo-top"
                alt="Sekolah Alam Cikeas">

            <div class="header-title">

                <h2 id="page-title">
                    PENELITIAN
                </h2>

                <p>
                    SMA Sekolah Alam Cikeas
                </p>

            </div>

        </div>


        <a
            href="javascript:history.back()"
            class="back-button">

            Kembali

        </a>

    </div>

</header>



<main class="container">

    <article class="paper">


        <!-- JUDUL -->

        <h1
            id="title"
            class="paper-title">
        </h1>


        <!-- SUBTITLE -->

        <p
            id="subtitle"
            class="paper-subtitle">
        </p>



        <!-- METADATA -->

        <div class="metadata">


            <div>

                <small>
                    Kode Penelitian
                </small>

                <strong id="paper-id"></strong>

            </div>



            <div>

                <small>
                    Peneliti
                </small>

                <strong id="author"></strong>

            </div>



            <div>

                <small>
                    Pembimbing
                </small>

                <strong id="mentor"></strong>

            </div>



            <div>

                <small>
                    Tahun
                </small>

                <strong id="year"></strong>

            </div>


        </div>



        <hr>



        <!-- MARKDOWN CONTENT -->

        <section
            id="content"
            class="paper-content">
        </section>


    </article>

</main>



<footer>

    <img
        src="asset/logo/image2.png"
        class="footer-logo"
        alt="Sekolah Alam Cikeas">

    <p>

        © 2026 Indonesia Advance Future (IAF)<br>

        Supported by Sekolah Alam Cikeas

    </p>

</footer>


</body>

</html>
