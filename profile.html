<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1">

    <title>Profil Murid | Sekolah Alam Cikeas</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="css/profile.css">

    <link
        rel="icon"
        type="image/png"
        href="icon-192.png">

    <script
        src="jsdata/profile.js"
        defer>
    </script>
    <script
        src="js/profile.js"
        defer>
    </script>

</head>


<body>


<header>

    <div class="header-container">

        <div class="header-brand">

            <img
                src="https://sekolahalamcikeas.sch.id/wp-content/uploads/2022/09/logo-sac-small.png"
                class="logo-top"
                alt="Sekolah Alam Cikeas">

            <div class="header-title">

                <h2 id="page-title">
                    MURID
                </h2>

                <p>
                    SMA Sekolah Alam Cikeas
                </p>

            </div>

        </div>


        <a
            href="javascript:history.back()"
            class="back-button">

            Kembali

        </a>

    </div>

</header>



<main class="container">


    <!-- =========================
         PROFILE
    ========================== -->

    <section class="profile">

        <div class="profile-photo-wrapper">

            <img
                id="profile-photo"
                class="profile-photo"
                src=""
                alt="Foto murid">

        </div>


        <div class="profile-info">

            <h1
                id="profile-name"
                class="profile-name">

                Memuat...

            </h1>


            <div
                id="profile-id"
                class="profile-id">

                NEXUS SAC | -

            </div>

        </div>

    </section>



    <!-- =========================
         AWARDS
    ========================== -->

    <section
        id="awards-section"
        class="section"
        hidden>

        <div class="section-heading">

            <h2>
                Penghargaan
            </h2>

        </div>


        <div
            id="awards-list"
            class="awards-list">
        </div>

    </section>



    <!-- =========================
         RESEARCH
    ========================== -->

    <section class="section">

        <div class="section-heading">

            <h2>
                Penelitian
            </h2>

            <p id="research-count">
                0 penelitian
            </p>

        </div>


        <div
            id="research-list"
            class="research-list">
        </div>

    </section>


</main>



<footer>

    <img
        src="asset/logo/image2.png"
        class="footer-logo"
        alt="Sekolah Alam Cikeas">

    <p>

        © 2026 Indonesia Advance Future (IAF)<br>

        Supported by Sekolah Alam Cikeas

    </p>

</footer>


</body>

</html>
