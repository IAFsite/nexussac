<!DOCTYPE html>

<html lang="id">

<head>

<meta charset="UTF-8">

<meta
 name="viewport"
 content="width=device-width, initial-scale=1.0">

<title>NEXUS SAC | 404</title>

<!-- =========================
     FAVICON
========================= -->

<link
    rel="icon"
    type="image/png"
    href="icon-192.png">

<!-- =========================
     GOOGLE FONT
========================= -->

<link
    rel="preconnect"
    href="https://fonts.googleapis.com">

<link
    rel="preconnect"
    href="https://fonts.gstatic.com"

<link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"

<!-- =========================
     STYLE
========================= -->

<style>

    :root{

        --primary:#1F4296;

        --primary-dark:#23306C;

        --background:#EEF3FF;

        --surface:#FFFFFF;

        --text:#24324B;

        --muted:#7B8798;

        --border:#E2EAF5;

        --footer:#F8FAFD;

    }


    /* ==========================
       RESET
    ========================== */

    *{

        margin:0;

        padding:0;

        box-sizing:border-box;

    }


    html{

        scroll-behavior:smooth;

    }


    body{

        font-family:"Inter",sans-serif;

        background:var(--background);

        color:var(--text);

        line-height:1.8;

        min-height:100vh;

        display:flex;

        flex-direction:column;

    }


    /* =========================
       HEADER
    ========================= */

    header{

        background:
            linear-gradient(
                135deg,
                var(--primary),
                var(--primary-dark)
            );

        box-shadow:
            0 4px 20px rgba(0,0,0,.08);

    }


    .header-container{

        max-width:1100px;

        width:100%;

        margin:auto;

        padding:18px 20px;

        display:flex;

        align-items:center;

        justify-content:space-between;

        gap:20px;

    }


    .header-brand{

        display:flex;

        align-items:center;

        gap:18px;

        min-width:0;

    }


    .logo-top{

        width:64px;

        height:64px;

        object-fit:contain;

        flex-shrink:0;

    }


    .header-title{

        min-width:0;

    }


    .header-title h2{

        color:white;

        font-size:1.15rem;

        font-weight:700;

    }


    .header-title p{

        color:rgba(255,255,255,.82);

        font-size:.9rem;

        margin-top:2px;

    }


    /* =========================
       BACK BUTTON
    ========================= */

    .back-button{

        display:inline-flex;

        align-items:center;

        flex-shrink:0;

        padding:9px 15px;

        background:rgba(255,255,255,.08);

        border:1px solid rgba(255,255,255,.35);

        border-radius:10px;

        color:white;

        text-decoration:none;

        font-size:.9rem;

        font-weight:600;

        transition:.2s ease;

    }


    .back-button:hover{

        background:rgba(255,255,255,.16);

        transform:translateX(-2px);

    }


    /* ==========================
       MAIN CONTAINER
    ========================== */

    .container{

        width:100%;

        max-width:960px;

        margin:auto;

        padding:45px 20px;

        flex:1;

        display:flex;

        align-items:center;

        justify-content:center;

    }


    /* =========================
       ERROR
    ========================= */

    .error-page{

        width:100%;

        background:var(--surface);

        border-radius:18px;

        padding:55px 45px;

        box-shadow:
            0 12px 35px rgba(0,0,0,.08);

        text-align:center;

    }


    .error-code{

        color:var(--primary);

        font-size:clamp(7rem,18vw,11rem);

        font-weight:700;

        line-height:1;

        letter-spacing:-6px;

        margin-bottom:20px;

    }


    .error-page h1{

        color:var(--text);

        font-size:2rem;

        font-weight:700;

        line-height:1.35;

        margin-bottom:10px;

    }


    .error-page p{

        max-width:560px;

        margin:0 auto;

        color:var(--muted);

        font-size:1rem;

        line-height:1.7;

    }


    /* =========================
       MAIN ACTION
    ========================= */

    .error-button{

        display:inline-flex;

        align-items:center;

        justify-content:center;

        margin-top:28px;

        padding:13px 22px;

        background:var(--primary);

        color:#FFFFFF;

        border-radius:10px;

        text-decoration:none;

        font-size:.95rem;

        font-weight:600;

        box-shadow:
            0 6px 16px rgba(31,66,150,.18);

        transition:
            background .2s ease,
            transform .2s ease,
            box-shadow .2s ease;

    }


    .error-button:hover{

        background:var(--primary-dark);

        transform:translateY(-2px);

        box-shadow:
            0 9px 22px rgba(35,48,108,.22);

    }


    .error-button:active{

        transform:translateY(0);

    }


    /* =========================
       FOOTER
    ========================= */

    footer{

        margin-top:70px;

        padding:45px 20px;

        background:#FFFFFF;

        border-top:
            1px solid var(--border);

        text-align:center;

    }


    .footer-logo{

        display:block;

        width:230px;

        max-width:90%;

        height:auto;

        margin:
            0 auto 20px;

    }


    footer p{

        color:#6B7280;

        font-size:.95rem;

        line-height:1.8;

    }


    /* =========================
       IAF FOOTER LOGO
    ========================= */

    .footer-iaf-logo{

        display:block;

        width:150px;

        max-width:100%;

        height:auto;

        margin:20px auto 0;

        opacity:.2;

    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width:700px){

        .header-container{

            padding:16px;

            gap:14px;

        }


        .logo-top{

            width:54px;

            height:54px;

        }


        .header-title h2{

            font-size:1rem;

        }


        .header-title p{

            font-size:.8rem;

        }


        .back-button{

            padding:8px 12px;

            font-size:.82rem;

        }


        .container{

            padding:25px 12px;

        }


        .error-page{

            padding:40px 20px;

            border-radius:14px;

        }


        .error-code{

            font-size:6rem;

            letter-spacing:-4px;

        }


        .error-page h1{

            font-size:1.6rem;

        }


        .error-page p{

            font-size:.9rem;

        }


        .error-button{

            padding:12px 20px;

        }


        footer{

            margin-top:0;

            padding:35px 20px;

        }


        .footer-logo{

            width:190px;

        }


        .footer-iaf-logo{

            width:150px;

            max-width:100%;

        }

    }

</style>

</head>

<body>

<!-- =========================
     HEADER
========================= -->

<header>

<div class="header-container">


<div class="header-brand">


    <img
        src="https://sekolahalamcikeas.sch.id/wp-content/uploads/2022/09/logo-sac-small.png"
        class="logo-top"
        alt="Sekolah Alam Cikeas">


    <div class="header-title">


        <h2>
            NEXUS SAC
        </h2>


        <p>
            SMA Sekolah Alam Cikeas
        </p>


    </div>


</div>


<a
    href="index.html"
    class="back-button">

    Kembali

</a>


</div>

</header>

<!-- =========================
     MAIN
========================= -->

<main class="container">

<section class="error-page">


<div class="error-code">
    404
</div>


<h1>
    Page Not Found
</h1>


<p>
    Halaman yang kamu cari tidak ditemukan
    atau mungkin sudah dipindahkan.
</p>


<a
    href="index.html"
    class="error-button">

    Kembali ke NEXUS

</a>


</section>

</main>

<!-- =========================
     FOOTER
========================= -->

<footer>

<img
 src="https://nexsac.indoadvfuture.com/asset/logo/image2.png"
 class="footer-logo"
 alt="Sekolah Alam Cikeas">

<p>


© 2026 Indonesia Advance Future (IAF)<br>

Supported by Sekolah Alam Cikeas


</p>

<img
 src="https://nexsac.indoadvfuture.com/asset/logo/iaf-logo.png"
 class="footer-iaf-logo"
 alt="Indonesia Advance Future">

<p id="nexus-version">
    Loading version...
</p>

</footer>

<!-- =========================
     VERSION
========================= -->

<script>

    fetch("version.json")

        .then(response => {

            if (!response.ok) {

                throw new Error(
                    "Failed to load version data"
                );

            }

            return response.json();

        })

        .then(data => {

            const versionElement =
                document.getElementById(
                    "nexus-version"
                );


            if (
                versionElement &&
                data.current_version
            ){

                versionElement.textContent =
                    `NEXSAC v${data.current_version}`;

            }

        })

        .catch(error => {

            console.error(
                "Version data error:",
                error
            );

        });

</script>

</body>

</html>
